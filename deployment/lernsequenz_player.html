<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernsequenz</title>
<style>
:root{--bg:#F4F5F2;--card:#FFFFFF;--line:#E3E5E0;--ink:#16191D;--muted:#5C6168;--accent:#0E6B5C;--accent-soft:#E8F2EF;--warn:#B45309;--warn-soft:#FBF1E6;--blue:#1D4ED8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
button,input{font:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--accent);text-transform:uppercase}
h1{margin:2px 0 0;font-size:24px;line-height:1.25;font-weight:800}
.progress{display:flex;gap:4px;flex:1 1 100%}
.progress span{height:6px;border-radius:3px;background:#D5D9D2;flex:1}
.progress span.done{background:var(--accent)}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:420px;overflow:hidden;box-shadow:0 10px 30px rgba(22,25,29,.06)}
.slide{padding:40px 44px;display:flex;flex-direction:column;gap:20px;min-height:420px;justify-content:center}
.slide h2{margin:0;font-size:30px;line-height:1.2;font-weight:800}
.statement{font-size:24px;line-height:1.35;font-weight:700;max-width:820px}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.point{background:var(--bg);border-radius:14px;padding:16px 18px;font-size:17px;display:flex;gap:12px;align-items:flex-start}
.point b{color:var(--accent);font-size:20px;line-height:1.2}
video{display:block;width:100%;max-height:560px;background:#10201C}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #CDD1CB;background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.link{border:none;background:none;color:var(--accent);font-weight:600;padding:0 8px}
.btn:disabled{opacity:.45;cursor:default}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px}
.panel h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.overlay{position:fixed;inset:0;background:rgba(8,16,14,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.frame{background:#fff;border-radius:16px;width:100%;max-width:820px;max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.frame header{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--accent);flex-wrap:wrap}
.frame .body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.frame footer{display:flex;justify-content:space-between;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:0}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:12px 14px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;width:100%}
.opt.sel{border-color:var(--blue);background:#EEF2FF}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--warn-soft)}
.refs{font-size:12px;color:var(--muted)}
.step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.step.ok{border-color:var(--accent);background:#F1F8F5}.step.no{border-color:var(--warn);background:#FDF6EE}
.step input[type=text]{width:150px;min-height:44px;border-radius:10px;border:1px solid #CDD1CB;padding:0 12px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
.board{background:#FBFBF8;background-image:radial-gradient(#E3E5E0 1px,transparent 1px);background-size:22px 22px;border-radius:12px;border:1px solid var(--line)}
.board svg{display:block;width:100%;height:auto;touch-action:none}
.hand{font-family:"Segoe Print","Comic Sans MS",cursive}
input[type=range]{width:100%;accent-color:var(--accent)}
.hidden{display:none !important}
.cmd{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:14px;background:#16191D;color:#E8F2EF;padding:12px 14px;border-radius:10px;white-space:pre-wrap;word-break:break-all;user-select:all;margin:0}
.cmdrow{display:flex;gap:8px;align-items:flex-start}
.cmdrow .cmd{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:14px}
.tab.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
textarea.out{width:100%;min-height:110px;border-radius:10px;border:1px solid #CDD1CB;padding:10px 12px;font:13px/1.45 Consolas,Menlo,monospace;resize:vertical}
.order{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;background:#fff}
.orow.ok{border-color:var(--accent);background:var(--accent-soft)}.orow.no{border-color:var(--warn);background:var(--warn-soft)}
.orow .row-text{flex:1;min-width:0}
.orow .pos{font-weight:700;color:var(--muted);min-width:2ch}
.grip{cursor:grab;color:var(--muted);touch-action:none;user-select:none;padding:0 4px;letter-spacing:-2px}
.btn.icon{min-width:44px;padding:0;font-size:18px}
.match{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.match.ok{border-color:var(--accent);background:var(--accent-soft)}.match.no{border-color:var(--warn);background:var(--warn-soft)}
.match .row-text{flex:1;min-width:140px;font-weight:600}
.match select{min-height:44px;border-radius:10px;border:1px solid #CDD1CB;padding:0 10px;background:#fff;font:inherit;min-width:180px}
.cmd.cloze{user-select:text;line-height:2}
.cmd .blank{display:inline-block;width:14ch;min-height:32px;border-radius:6px;border:1px solid #CDD1CB;padding:0 8px;font:inherit;color:var(--ink);background:#fff;vertical-align:middle;margin:0 2px}
.cmd .blank.ok{border-color:var(--accent);background:var(--accent-soft)}.cmd .blank.no{border-color:var(--warn);background:var(--warn-soft)}
.hotspot{position:relative;max-width:100%;margin:0 auto;flex:none;user-select:none;touch-action:none;cursor:crosshair;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.hotspot img{position:absolute;inset:0;width:100%;height:100%;display:block}
.hotspot .mark{position:absolute;border:2px solid var(--blue);background:rgba(29,78,216,.18);pointer-events:none}
.hotspot .mark.target{border-color:var(--accent);background:rgba(14,107,92,.22)}
.terminal{background:#16191D;color:#E8F2EF;border-radius:10px;padding:12px 14px;font:14px/1.5 Consolas,"Cascadia Mono",Menlo,monospace}
.terminal .screen{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;font:inherit}
.terminal .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.terminal .prompt{color:#9BD3C5;white-space:nowrap}
.terminal input{flex:1;min-width:160px;min-height:36px;background:#0E1114;color:#E8F2EF;border:1px solid #3A4046;border-radius:8px;padding:0 10px;font:inherit}
.terminal .btn{background:#2A3036;border-color:#3A4046;color:#E8F2EF}
@media (max-width:600px){.slide{padding:24px 20px}.slide h2{font-size:24px}.statement{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow" id="kind">Interaktive Präsentation</div><h1 id="title">Lädt …</h1></div>
    <div class="row"><button class="btn" id="speak" type="button">Vorlesen</button><span class="small" id="count"></span></div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="bar">
    <button class="btn" id="prev" type="button">Zurück</button>
    <button class="btn primary" id="next" type="button">Weiter</button>
  </div>
  <div class="side">
    <div class="panel"><h3>Sprechertext</h3><div id="narration"></div></div>
    <div class="panel"><h3>Belegt durch</h3><div id="sources" class="small"></div></div>
    <div class="panel" id="tutorPanel"><h3>Tutor zu dieser Folie</h3></div>
  </div>
</div>
<script nonce="__NONCE__">
(() => {
  const token = new URLSearchParams(location.search).get('k') || '';
  const base = location.pathname.replace(/\/$/, '');
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return node;
  };
  const svgEl = (tag, attrs = {}) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  };
  const COLORS = { ink: '#16191D', accent: '#0E6B5C', warn: '#B45309', blue: '#1D4ED8' };
  let seq = null, index = 0, done = new Set(), opening = new Set(), video = null, sourceTitles = {};

  // "Dein Weg": the learner's answers decide which slides and checkpoints apply (only_for).
  // An unanswered key hides nothing; only an answer that differs does.
  let profile = {};
  try { profile = JSON.parse(localStorage.getItem('lernsequenz-profil') || '{}') || {}; } catch (_) { profile = {}; }
  function setProfile(choices) {
    profile = { ...profile, ...choices };
    try {
      localStorage.setItem('lernsequenz-profil', JSON.stringify(profile));
      if (choices.shell) localStorage.setItem('lernsequenz-shell', choices.shell);
    } catch (_) {}
  }
  const matches = (item) => (item.only_for || []).every((c) => !(c.key in profile) || profile[c.key] === c.option);
  const visible = () => seq.sections.filter(matches);
  const preferredShell = (shells) => {
    if (shells.includes(profile.shell)) return profile.shell;
    try { const kept = localStorage.getItem('lernsequenz-shell'); if (shells.includes(kept)) return kept; } catch (_) {}
    return shells[0];
  };

  async function post(checkpoint_id, answer) {
    const res = await fetch(`${base}/antwort?k=${encodeURIComponent(token)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ checkpoint_id, answer }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Antwort wurde nicht angenommen');
    return data;
  }
  async function postTo(path, body) {
    const res = await fetch(`${base}/${path}?k=${encodeURIComponent(token)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Anfrage wurde nicht angenommen');
    return data;
  }
  const UNREADABLE = { spanne: 'Bitte eine Zahl, keine Spanne.', datum: 'Das sieht wie ein Datum aus.', leer: '', unlesbar: 'Das kann ich nicht als Zahl lesen.' };
  // Shows how a typed number is read before it is graded; 45.000 vs 45,000 asks instead of guessing.
  function readingBox(input, unit) {
    const box = el('div', { class: 'small reading', 'aria-live': 'polite' });
    let timer = null, last = '';
    const choose = (value) => { input.value = String(value); refresh(); input.focus(); };
    async function refresh() {
      const text = input.value.trim();
      if (text === last) return;
      last = text;
      if (!text) { box.replaceChildren(); return; }
      try {
        const r = await postTo('lesen', { text });
        if (r.reason) { box.textContent = UNREADABLE[r.reason] || ''; return; }
        if (r.ambiguous) {
          box.replaceChildren('Meinen Sie ',
            el('button', { class: 'btn link', type: 'button', style: 'min-height:32px', onclick: () => choose(r.value) }, `${r.display} ${unit || ''}`.trim()),
            ' oder ',
            el('button', { class: 'btn link', type: 'button', style: 'min-height:32px', onclick: () => choose(r.alternative.value) }, `${r.alternative.display} ${unit || ''}`.trim()),
            '?');
          return;
        }
        box.textContent = `= ${r.display} ${r.percent ? '%' : (unit || '')}`.trim();
      } catch (_) { box.replaceChildren(); }
    }
    input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(refresh, 250); });
    return box;
  }
  const refsText = (refs) => {
    const titles = [...new Set((refs || []).map((r) => sourceTitles[r]).filter(Boolean))];
    return titles.length ? 'Quelle: ' + titles.join(' · ') : '';
  };

  // Tutor: the server builds the context (slide or checkpoint, never a solution).
  function tutorBox(context) {
    const input = el('input', { type: 'text', placeholder: 'Frage an den Tutor …', 'aria-label': 'Frage an den Tutor', maxlength: '500',
      style: 'flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid #CDD1CB;padding:0 12px' });
    const out = el('div', { class: 'small', style: 'line-height:1.5' });
    const ask = el('button', { class: 'btn', type: 'button', onclick: async () => {
      const question = input.value.trim();
      if (!question) return;
      ask.disabled = true; out.textContent = 'Der Tutor denkt nach …';
      try {
        const res = await fetch(`${base}/tutor?k=${encodeURIComponent(token)}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, ...context() }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || 'Der Tutor ist gerade nicht erreichbar.');
        out.replaceChildren(el('div', { style: 'font-size:15px;color:var(--ink)' }, data.answer),
          el('div', { style: 'margin-top:6px' }, el('strong', {}, 'Nächster Schritt: '), data.next_step),
          data.cited && data.cited.length ? el('div', { class: 'refs', style: 'margin-top:4px' }, 'Gestützt auf: „' + data.cited[0] + '…“') : null);
      } catch (err) { out.textContent = err.message; }
      ask.disabled = false;
    } }, 'Fragen');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask.click(); });
    return el('div', { style: 'display:flex;flex-direction:column;gap:8px' }, el('div', { class: 'row' }, input, ask), out);
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    const voice = speechSynthesis.getVoices().find((v) => v.lang && v.lang.startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  function render() {
    const vis = visible();
    if (index >= vis.length) index = Math.max(0, vis.length - 1);
    const section = vis[index];
    $('count').textContent = `${index + 1} / ${vis.length}`;
    $('progress').replaceChildren(...vis.map((_, i) => el('span', { class: i <= index ? 'done' : '' })));
    $('prev').disabled = index === 0;
    $('next').textContent = index === vis.length - 1 ? 'Abschließen' : 'Weiter';
    $('narration').textContent = section.narration || section.transcript || '';
    $('sources').textContent = refsText(section.refs) || 'Kursmaterial';
    video = null;
    if (section.kind === 'video') {
      // WebM first (Chromium without H.264), the MP4 for Safari/iPad; a missing source is skipped.
      const at = section.start_s ? `#t=${section.start_s}` : '';
      video = el('video', { controls: true, preload: 'metadata', playsinline: true });
      if (/\.mp4$/.test(section.url)) video.append(el('source', { src: section.url.replace(/\.mp4$/, '.webm') + at, type: 'video/webm' }));
      video.append(el('source', { src: section.url + at, type: /\.webm$/.test(section.url) ? 'video/webm' : 'video/mp4' }));
      const timed = seq.checkpoints.filter((c) => matches(c) && c.after_section === section.section_id && c.at_s !== null && c.at_s !== undefined);
      video.addEventListener('timeupdate', () => {
        // timeupdate fires again before the pause lands; open each checkpoint only once.
        const due = timed.find((c) => !done.has(c.checkpoint_id) && !opening.has(c.checkpoint_id) && video.currentTime >= c.at_s);
        if (due) { opening.add(due.checkpoint_id); video.pause(); openCheckpoints([due]); }
      });
      $('stage').replaceChildren(video);
    } else {
      const kids = [el('h2', {}, section.title)];
      if (section.statement) kids.push(el('div', { class: 'statement' }, section.statement));
      if (section.points && section.points.length) {
        kids.push(el('div', { class: 'points' }, section.points.map((p, i) => el('div', { class: 'point' }, el('b', {}, String(i + 1)), el('span', {}, p)))));
      }
      $('stage').replaceChildren(el('div', { class: 'slide' }, kids));
    }
  }

  function pendingAfter(section) {
    // Checkpoints anchored to slides the profile hides open here, at the previous visible slide.
    const all = seq.sections, anchors = new Set([section.section_id]);
    for (let i = all.indexOf(section) + 1; i < all.length && !matches(all[i]); i += 1) anchors.add(all[i].section_id);
    return seq.checkpoints.filter((c) => matches(c) && anchors.has(c.after_section) && !done.has(c.checkpoint_id) && (section.kind !== 'video' || c.at_s === null || c.at_s === undefined));
  }

  function openCheckpoints(list, then) {
    if (!list.length) { if (then) then(); return; }
    const [first, ...rest] = list;
    showFrame(first, () => { done.add(first.checkpoint_id); openCheckpoints(rest, then); });
  }

  function frame(cp, body, footerKids) {
    const tutor = tutorBox(() => ({ checkpoint_id: cp.checkpoint_id }));
    tutor.classList.add('hidden');
    const overlay = el('div', { class: 'overlay', role: 'dialog', 'aria-label': cp.title },
      el('div', { class: 'frame' },
        el('header', {}, el('span', {}, ({ explanation: 'ERKLÄRUNG', choice: 'HALTEPUNKT · FRAGE', calculation: 'RECHENAUFGABE', estimate: 'SCHÄTZEN', drawn_explanation: 'AN DER TAFEL ERKLÄRT', command_check: 'IM TERMINAL PRÜFEN',
          ordering: 'REIHENFOLGE', cloze: 'BEFEHL VERVOLLSTÄNDIGEN', matching: 'ZUORDNEN', hotspot: 'STELLE MARKIEREN', terminal_sim: 'ÜBUNGS-TERMINAL', step: 'SCHRITT', profile: 'DEIN WEG' })[cp.kind] || 'HALTEPUNKT'),
          el('button', { class: 'btn link', type: 'button', style: 'min-height:32px;font-size:13px', onclick: () => tutor.classList.toggle('hidden') }, 'Tutor fragen')),
        el('div', { class: 'body' }, body, tutor),
        el('footer', {}, footerKids)));
    // Over the whole viewport: inside the stage the frame was clipped (buttons cut off).
    document.body.append(overlay);
    const focusable = overlay.querySelector('button, input');
    if (focusable) focusable.focus();
    return overlay;
  }

  function showFrame(cp, close) {
    const finish = (overlay) => { overlay.remove(); if (video) video.play().catch(() => {}); close(); };
    if (cp.kind === 'explanation') {
      const o = frame(cp, [el('p', { style: 'margin:0;font-size:17px' }, cp.text), el('div', { class: 'refs' }, refsText(cp.refs))],
        [el('span'), el('button', { class: 'btn primary', type: 'button', onclick: () => finish(o) }, 'Weiter')]);
    } else if (cp.kind === 'choice') choiceFrame(cp, finish);
    else if (cp.kind === 'calculation') calcFrame(cp, finish);
    else if (cp.kind === 'estimate') estimateFrame(cp, finish);
    else if (cp.kind === 'drawn_explanation') drawFrame(cp, finish);
    else if (cp.kind === 'command_check') commandFrame(cp, finish);
    else if (cp.kind === 'ordering') orderingFrame(cp, finish);
    else if (cp.kind === 'cloze') clozeFrame(cp, finish);
    else if (cp.kind === 'matching') matchingFrame(cp, finish);
    else if (cp.kind === 'hotspot') hotspotFrame(cp, finish);
    else if (cp.kind === 'terminal_sim') terminalFrame(cp, finish);
    else if (cp.kind === 'step') stepFrame(cp, finish);
    else if (cp.kind === 'profile') profileFrame(cp, finish);
    else finish({ remove() {} });
  }

  const SHELL_NAMES = { powershell: 'Windows PowerShell', cmd: 'Windows CMD', unix: 'macOS / Linux' };
  const SHELL_HINTS = { powershell: 'Eingabezeile beginnt mit „PS C:\\…“', cmd: 'Eingabezeile beginnt mit „C:\\…“ (ohne PS)', unix: 'Programm „Terminal“' };

  // Embedded pages may lack the clipboard permission: fall back to a selected text copy.
  async function copyText(text, button) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
      const area = el('textarea', { style: 'position:fixed;top:-1000px;opacity:0' });
      area.value = text; document.body.append(area); area.select();
      try { ok = document.execCommand('copy'); } catch (__) { ok = false; }
      area.remove();
    }
    const label = button.textContent;
    button.textContent = ok ? 'Kopiert ✓' : 'Bitte markieren und kopieren';
    setTimeout(() => { button.textContent = label; }, 1800);
  }
  const commandLine = (text) => {
    const copy = el('button', { class: 'btn', type: 'button', onclick: () => copyText(text, copy) }, 'Kopieren');
    return el('div', { class: 'cmdrow' }, el('pre', { class: 'cmd' }, text), copy);
  };

  function commandFrame(cp, finish) {
    const shells = cp.commands.map((c) => c.shell);
    let shell = preferredShell(shells);

  function hotspotFrame(cp, finish) {
    let start = null, rect = null, checked = false;
    const img = el('img', { src: cp.image, alt: cp.title, draggable: 'false', width: cp.width, height: cp.height });
    const mark = el('div', { class: 'mark hidden' });
    const box = el('div', { class: 'hotspot' }, img, mark);
    // Sized by hand: as wide as the frame allows, at most half the viewport high, never upscaled.
    const fit = () => {
      const parent = box.parentElement, style = parent ? getComputedStyle(parent) : null;
      const avail = parent ? parent.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight) : cp.width;
      const scale = Math.min(avail / cp.width, window.innerHeight * 0.5 / cp.height, 1);
      box.style.width = `${Math.round(cp.width * scale)}px`; box.style.height = `${Math.round(cp.height * scale)}px`;
    };
    window.addEventListener('resize', fit);
    const leave = (overlay) => { window.removeEventListener('resize', fit); finish(overlay); };
    const fb = el('div', { class: 'hidden' });
    const clamp = (v) => Math.min(Math.max(v, 0), 1);
    const toImage = (e) => { const r = img.getBoundingClientRect(); return { x: Math.round(clamp((e.clientX - r.left) / r.width) * cp.width), y: Math.round(clamp((e.clientY - r.top) / r.height) * cp.height) }; };

      node.style.left = `${r.x / cp.width * 100}%`; node.style.top = `${r.y / cp.height * 100}%`;
      node.style.width = `${r.w / cp.width * 100}%`; node.style.height = `${r.h / cp.height * 100}%`;
      node.classList.remove('hidden');
    };
    box.addEventListener('pointerdown', (e) => { if (checked) return; e.preventDefault(); box.setPointerCapture(e.pointerId); start = toImage(e); rect = { ...start, w: 0, h: 0 }; place(mark, rect); check.disabled = true; });

      try {

    const o = frame(cp, [el('p', { class: 'q' }, cp.task), el('div', { class: 'small' }, 'Ziehen Sie mit gedrückter Maustaste oder dem Finger einen Rahmen um die Stelle.'), box, fb],

    async function check() {
      const values = {};
      for (const [id, input] of Object.entries(inputs)) if (input.value.trim()) values[id] = input.value;
      if (!Object.keys(values).length) return;
      try {
        const r = await post(cp.checkpoint_id, { values });
        for (const s of r.steps) {
          boxes[s.step_id].className = 'step ' + (s.correct ? 'ok' : 'no');
          notes[s.step_id].className = 'small';
          notes[s.step_id].textContent = !s.readable ? 'Bitte eine Zahl eingeben.' : s.correct
            ? (s.follow_up ? 'Richtig weitergerechnet – der Fehler stammt aus dem Schritt davor und zählt nur dort.' : 'Richtig.')
            : s.separator_hint ? 'Der Wert stimmt, nur das Tausender-Trennzeichen war anders gemeint. Schreiben Sie die Zahl ohne Trennzeichen, z. B. 45000.'
            : 'Noch nicht. Prüfen Sie Formel und Einheit.';
        }
      } catch (err) { alertBox.textContent = err.message; alertBox.className = 'fb no'; }
    }
    const alertBox = el('div', { class: 'hidden' });
    const o = frame(cp, [el('div', { class: 'panel', style: 'background:var(--bg);border:none' }, cp.task), ...steps,
      el('div', { class: 'small' }, `Toleranz ±${cp.tolerance_percent} %. Folgefehler zählen nur einmal.`), alertBox, el('div', { class: 'refs' }, refsText(cp.refs))],
      [el('span'), el('button', { class: 'btn primary', type: 'button', onclick: () => finish(o) }, 'Weiter')]);
  }

  function estimateFrame(cp, finish) {
    const mid = Math.round((cp.minimum + cp.maximum) / 2 / cp.step) * cp.step;
    const label = el('strong', {}, `${mid} ${cp.unit}`);
    const range = el('input', { type: 'range', min: cp.minimum, max: cp.maximum, step: cp.step, value: mid, 'aria-label': 'Schätzung',
      oninput: () => { label.textContent = `${range.value} ${cp.unit}`; } });
    const fb = el('div', { class: 'hidden' });
    let revealed = false;
    const go = el('button', { class: 'btn primary', type: 'button', onclick: async () => {
      if (revealed) { finish(o); return; }
      try {
        const r = await post(cp.checkpoint_id, { value: Number(range.value) });
        revealed = true; range.disabled = true;
        fb.className = 'fb ' + (r.inside_band ? 'ok' : 'no');
        fb.replaceChildren(el('strong', {}, r.inside_band ? 'Gut geschätzt. ' : 'Daneben. '),
          `Richtwert ${r.value} ${cp.unit} (Bandbreite ${r.good_from}–${r.good_to} ${cp.unit}). `, r.rationale, el('div', { class: 'refs' }, refsText(r.refs)));
        go.textContent = 'Weiter';
      } catch (err) { fb.className = 'fb no'; fb.textContent = err.message; }
    } }, 'Auflösen');
    const o = frame(cp, [el('p', { class: 'q' }, cp.question), range, el('div', {}, 'Ihre Schätzung: ', label), fb],
      [el('button', { class: 'btn link', type: 'button', onclick: () => finish(o) }, 'Überspringen'), go]);
  }

  function drawFrame(cp, finish) {
    const svg = svgEl('svg', { viewBox: `0 0 ${cp.width} ${cp.height}`, role: 'img', 'aria-label': cp.title });
    const caption = el('div', { style: 'font-size:16px' });
    const own = svgEl('g');
    let strokes = [], current = null, drawing = false, timer = null;
    function play() {
      clearTimeout(timer);
      [...svg.querySelectorAll('.drawn')].forEach((n) => n.remove());
      let i = 0;
      const next = () => {
        if (i >= cp.steps.length) return;
        const step = cp.steps[i];
        caption.textContent = step.narration;
        step.strokes.forEach((s) => {
          const p = svgEl('path', { d: s.path, fill: 'none', stroke: COLORS[s.color] || COLORS.ink, 'stroke-width': '3.5', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'drawn' });
          svg.insertBefore(p, own);
          const len = p.getTotalLength();
          p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
          p.getBoundingClientRect();
          p.style.transition = 'stroke-dashoffset 1.1s ease-in-out';
          requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; });
        });
        timer = setTimeout(() => {
          step.labels.forEach((l) => {
            const t = svgEl('text', { x: l.x, y: l.y, 'text-anchor': 'middle', fill: COLORS[l.color] || COLORS.ink, 'font-size': '26', class: 'drawn hand' });
            t.textContent = l.text; svg.insertBefore(t, own);
            // Shrink a label until it fits between its neighbours on the same row and the board edges.
            const others = cp.steps.flatMap((s) => s.labels).filter((o) => o !== l && Math.abs(o.y - l.y) < 30);
            let room = Math.min(2 * l.x, 2 * (cp.width - l.x)) - 8;
            // Boxes on a row are drawn with gaps between them: keep within ~78 % of the spacing.
            others.forEach((o) => { room = Math.min(room, Math.abs(o.x - l.x) * 0.78); });
            let size = 26;
            while (size > 13 && t.getComputedTextLength() > room) { size -= 1; t.setAttribute('font-size', String(size)); }
          });
          i += 1;
          timer = setTimeout(next, 900);
        }, 1150);
      };
      next();
    }
    svg.append(own);
    const point = (e) => { const r = svg.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * cp.width), Math.round((e.clientY - r.top) / r.height * cp.height)]; };
    const redraw = () => {
      own.replaceChildren(...strokes.concat(current ? [current] : []).map((pts) => svgEl('polyline', { points: pts.map((p) => p.join(',')).join(' '), fill: 'none', stroke: COLORS.blue, 'stroke-width': '4', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })));
    };
    svg.addEventListener('pointerdown', (e) => { if (!drawing) return; svg.setPointerCapture(e.pointerId); current = [point(e)]; redraw(); });
    svg.addEventListener('pointermove', (e) => { if (!drawing || !current) return; current.push(point(e)); redraw(); });
    const up = () => { if (current) { strokes.push(current); current = null; redraw(); } };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    const status = el('div', { class: 'hidden' });
    const drawBtn = el('button', { class: 'btn', type: 'button', onclick: () => {
      drawing = !drawing;
      drawBtn.textContent = drawing ? 'Fertig' : 'Selbst einzeichnen';
      caption.textContent = drawing ? (cp.draw_task || 'Ergänzen Sie die Skizze.') : caption.textContent;
      submit.classList.toggle('hidden', !drawing);
    } }, 'Selbst einzeichnen');
    const submit = el('button', { class: 'btn primary hidden', type: 'button', onclick: async () => {
      if (!strokes.length) return;
      try { await post(cp.checkpoint_id, { strokes }); status.className = 'fb ok'; status.textContent = 'Ihre Skizze ist gespeichert. Ihre Beraterin sieht sie sich an.'; submit.disabled = true; }
      catch (err) { status.className = 'fb no'; status.textContent = err.message; }
    } }, 'Skizze abgeben');
    const o = frame(cp, [el('div', { class: 'board' }, svg), caption, status, el('div', { class: 'refs' }, refsText(cp.refs))],
      [el('div', { class: 'row' }, el('button', { class: 'btn', type: 'button', onclick: play }, 'Nochmal zeichnen'), cp.draw_task ? drawBtn : null),
       el('div', { class: 'row' }, submit, el('button', { class: 'btn primary', type: 'button', onclick: () => { clearTimeout(timer); finish(o); } }, 'Weiter'))]);
    play();
  }

  $('prev').addEventListener('click', () => { if (index > 0) { index -= 1; render(); } });
  $('next').addEventListener('click', () => {
    const section = visible()[index];
    // What is pending is read again after every frame: a profile answered on the way
    // changes which slides are shown and therefore which checkpoints belong here.
    const step = () => {
      const [first] = pendingAfter(section);
      if (first) { showFrame(first, () => { done.add(first.checkpoint_id); step(); }); return; }
      const vis = visible(), here = vis.indexOf(section);
      if (here < vis.length - 1) { index = here + 1; render(); }
      else { $('stage').replaceChildren(el('div', { class: 'slide' }, el('h2', {}, 'Geschafft'), el('div', { class: 'statement' }, 'Sie haben diese Sequenz abgeschlossen.'))); }
    };
    step();
  });
  $('speak').addEventListener('click', () => speak($('narration').textContent));
  document.addEventListener('keydown', (e) => {
    if (document.querySelector('.overlay')) return;
    if (e.key === 'ArrowRight') $('next').click();
    if (e.key === 'ArrowLeft') $('prev').click();
  });

  fetch(`${base}/daten?k=${encodeURIComponent(token)}`).then((r) => { if (!r.ok) throw new Error(); return r.json(); }).then((data) => {
    seq = data;
    sourceTitles = Object.fromEntries((data.sources || []).map((s) => [s.ref, s.title]));
    $('title').textContent = data.title;
    document.title = data.title;
    $('kind').textContent = data.kind === 'video' ? 'Interaktives Video' : 'Interaktive Präsentation';
    if (!('speechSynthesis' in window)) $('speak').classList.add('hidden');
    $('tutorPanel').append(tutorBox(() => ({ section_id: visible()[index].section_id })));
    render();
  }).catch(() => { $('title').textContent = 'Diese Lernsequenz ist nicht verfügbar.'; });
})();
</script>
</body>
</html>
